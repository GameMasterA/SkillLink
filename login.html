<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — SkillLink Marketplace</title>
    <meta name="description" content="Sign in to your SkillLink account to manage freelance projects, proposals, contracts, and talent requests.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">

    <!-- 6 Floating Liquid Glass Background Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
    <div class="bg-shape shape-4"></div>
    <div class="bg-shape shape-5"></div>
    <div class="bg-shape shape-6"></div>

    <main class="auth-wrapper">
        <a href="index.html" class="logo">
            <svg class="logo-mark-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGradLogin" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#0284c7" />
                        <stop offset="1" stop-color="#2563eb" />
                    </linearGradient>
                </defs>
                <rect width="36" height="36" rx="10" fill="url(#logoGradLogin)" />
                <path d="M11 18C11 14.134 14.134 11 18 11C20.5 11 22.7 12.3 23.9 14.3" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                <path d="M25 18C25 21.866 21.866 25 18 25C15.5 25 13.3 23.7 12.1 21.7" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                <circle cx="18" cy="18" r="2.5" fill="white" />
            </svg>
            <span>Skill<span style="color: var(--primary);">Link</span></span>
        </a>

        <section class="auth-card form-card">
            <div class="auth-header">
                <span class="badge">Welcome Back</span>
                <h1>Sign in to SkillLink</h1>
                <p>Access your client, freelancer, or admin dashboard.</p>
            </div>

            <!-- Demo Account Quick Sign-in Buttons -->
            <div class="demo-login-panel">
                <p class="demo-login-label">
                    <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px; height:14px; color:var(--primary);"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                    <span>Quick Demo Login</span>
                </p>
                <div class="demo-login-btns">
                    <button type="button" onclick="fillDemoLogin('freelancer@skilllink.com', 'password123')" class="btn btn-outline btn-sm" style="font-size: 0.8rem; gap:6px;">
                        <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span>Freelancer</span>
                    </button>
                    <button type="button" onclick="fillDemoLogin('client@skilllink.com', 'password123')" class="btn btn-outline btn-sm" style="font-size: 0.8rem; gap:6px;">
                        <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px; height:14px;"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                        <span>Client</span>
                    </button>
                    <button type="button" onclick="fillDemoLogin('admin@skilllink.com', 'admin123')" class="btn btn-outline btn-sm" style="font-size: 0.8rem; gap:6px;">
                        <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px; height:14px;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                        <span>Admin</span>
                    </button>
                </div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required style="width: 100%;">
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="loginPassword" style="margin-bottom:0;">Password</label>
                        <a href="#" onclick="if(typeof showToast==='function') showToast('Demo password reset link sent!', 'info')" class="inline-link" style="font-size: 0.85rem;">Forgot Password?</a>
                    </div>
                    <input type="password" id="loginPassword" placeholder="Enter password" required style="width: 100%;">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-weight: 700; margin-top: 0.5rem;">Sign In</button>
                <div class="form-alert" id="loginAlert" style="display: none;"></div>
            </form>

            <p class="auth-switch">
                Don't have an account? <a href="register.html">Create one</a>
            </p>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        function fillDemoLogin(email, pass) {
            const emailInp = document.getElementById("loginEmail");
            const passInp = document.getElementById("loginPassword");
            if (emailInp && passInp) {
                emailInp.value = email;
                passInp.value = pass;
                if (typeof showToast === "function") {
                    showToast("Demo credentials filled! Click Sign In.", "info");
                }
            }
        }
    </script>

</body>
</html>
