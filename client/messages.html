<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — Client Workspace | SkillLink</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body id="clientDashboardRoot">

    <!-- 6 Floating Liquid Glass Background Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
    <div class="bg-shape shape-4"></div>
    <div class="bg-shape shape-5"></div>
    <div class="bg-shape shape-6"></div>

    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <div>
                <a href="../index.html" class="logo">
                    <svg class="logo-mark-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGradClMsg" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#0284c7" />
                                <stop offset="1" stop-color="#2563eb" />
                            </linearGradient>
                        </defs>
                        <rect width="36" height="36" rx="10" fill="url(#logoGradClMsg)" />
                        <path d="M11 18C11 14.134 14.134 11 18 11C20.5 11 22.7 12.3 23.9 14.3" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                        <path d="M25 18C25 21.866 21.866 25 18 25C15.5 25 13.3 23.7 12.1 21.7" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                        <circle cx="18" cy="18" r="2.5" fill="white" />
                    </svg>
                    <span>Skill<span style="color: var(--primary);">Link</span></span>
                </a>
                <ul class="nav-list">
                    <li><a href="dashboard.html" class="nav-link">
                        <svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        <span>Overview</span>
                    </a></li>
                    <li><a href="post-job.html" class="nav-link">
                        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span>Post a Job</span>
                    </a></li>
                    <li><a href="my-jobs.html" class="nav-link">
                        <svg class="svg-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                        <span>My Posted Jobs</span>
                    </a></li>
                    <li><a href="proposals.html" class="nav-link">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <span>Received Proposals</span>
                    </a></li>
                    <li><a href="projects.html" class="nav-link">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        <span>Active Contracts</span>
                    </a></li>
                    <li><a href="messages.html" class="nav-link active">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        <span>Messages</span>
                    </a></li>
                    <li><a href="settings.html" class="nav-link">
                        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        <span>Settings</span>
                    </a></li>
                </ul>
            </div>
            <div style="padding-top: 20px; border-top: 1px solid var(--glass-border);">
                <button onclick="handleLogout()" class="btn btn-outline" style="width: 100%; justify-content: center; gap:8px;">
                    <svg class="svg-icon" viewBox="0 0 24 24" style="width:16px; height:16px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    <span>Sign Out</span>
                </button>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="top-navbar">
                <button class="mobile-toggle" id="sidebarToggle" aria-label="Toggle Navigation">
                    <svg class="svg-icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--text-dark);">Freelancer Messaging Workspace</h2>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="user-avatar-initial" style="width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-emerald), #059669); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700;">S</div>
                    <span class="user-display-name" style="font-weight: 700; font-size: 0.9rem;">Client</span>
                </div>
            </header>

            <main style="padding: 28px;">
                <div class="glass-card" id="chatInterfaceContainer" style="display: grid; grid-template-columns: 290px 1fr; height: 620px; border-radius: var(--radius-xl); overflow: hidden;">
                    <!-- Conversations Sidebar -->
                    <div style="border-right: 1px solid var(--glass-border); background: rgba(255,255,255,0.4); display: flex; flex-direction: column;">
                        <div style="padding: 16px; border-bottom: 1px solid var(--glass-border);">
                            <h3 style="font-size: 1rem; font-weight: 700; color: var(--text-dark);">Conversations</h3>
                        </div>
                        <div id="conversationsList" style="flex: 1; overflow-y: auto; padding: 10px;"></div>
                    </div>

                    <!-- Chat Active Window -->
                    <div style="display: flex; flex-direction: column; background: rgba(255,255,255,0.2);">
                        <div style="padding: 16px 20px; border-bottom: 1px solid var(--glass-border); background: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: space-between;">
                            <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
                                <button type="button" id="backToConversations" class="chat-back-button" aria-label="Back to conversations" title="Back to conversations">
                                    <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path><path d="M9 12h12"></path></svg>
                                </button>
                                <h3 id="chatHeaderTitle" style="font-size: 1.05rem; font-weight: 700; color: var(--text-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Freelancer</h3>
                            </div>
                            <span class="badge">Freelancer</span>
                        </div>

                        <div id="chatMessagesBody" style="flex: 1; overflow-y: auto; padding: 20px;"></div>

                        <form id="sendMessageForm" style="padding: 16px; border-top: 1px solid var(--glass-border); background: rgba(255,255,255,0.7); display: flex; gap: 10px;">
                            <input type="text" id="chatInput" placeholder="Type your message here..." required style="flex: 1;">
                            <button type="submit" class="btn btn-primary" style="padding: 12px 24px; gap:6px;">
                                <span>Send</span>
                                <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px; height:14px;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/messages.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
