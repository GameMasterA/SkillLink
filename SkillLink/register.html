<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — SkillLink Marketplace</title>
    <meta name="description" content="Create a free SkillLink account as a freelancer to discover remote work or as a client to hire talent.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
    <div class="bg-shape shape-4"></div>
    <div class="bg-shape shape-5"></div>
    <div class="bg-shape shape-6"></div>

    <main class="auth-wrapper">
        <a href="index.html" class="logo">
            <svg class="logo-mark-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGradReg" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#0284c7" />
                        <stop offset="1" stop-color="#2563eb" />
                    </linearGradient>
                </defs>
                <rect width="36" height="36" rx="10" fill="url(#logoGradReg)" />
                <path d="M11 18C11 14.134 14.134 11 18 11C20.5 11 22.7 12.3 23.9 14.3" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                <path d="M25 18C25 21.866 21.866 25 18 25C15.5 25 13.3 23.7 12.1 21.7" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                <circle cx="18" cy="18" r="2.5" fill="white" />
            </svg>
            <span>Skill<span style="color: var(--primary);">Link</span></span>
        </a>

        <section id="roleSelectionStep" class="auth-card selection-card">
            <div class="auth-header">
                <span class="badge">Get Started</span>
                <h1>What are you here to do?</h1>
                <p>Choose the option that best matches your career or business goals.</p>
            </div>

            <div class="role-selector">
                <button type="button" class="role-card" onclick="selectRole('freelancer')">
                    <div class="role-icon">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                    <div class="role-info">
                        <h2>I'm a Freelancer</h2>
                        <p>Find projects, showcase your skills, and earn income safely.</p>
                    </div>
                </button>

                <button type="button" class="role-card" onclick="selectRole('client')">
                    <div class="role-icon">
                        <svg class="svg-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                    </div>
                    <div class="role-info">
                        <h2>I'm a Client</h2>
                        <p>Post job offers, review proposals, and hire verified freelance talent.</p>
                    </div>
                </button>
            </div>

            <p class="auth-switch">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </section>

        <section id="registrationFormStep" class="auth-card form-card hidden">
            <div class="auth-header" style="text-align: left;">
                <button type="button" class="back-link" onclick="goBackToRoles()">
                    <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px; height:14px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Change role</span>
                </button>
                <h1 id="formTitle">Create your account</h1>
                <p id="formSubtitle">Fill out your details to get started.</p>
            </div>

            <form id="registerForm">
                <input type="hidden" id="selectedRole" value="freelancer">

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="John" required style="width: 100%;">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Doe" required style="width: 100%;">
                    </div>
                </div>

                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" placeholder="you@example.com" required style="width: 100%;">
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Create a strong password" required style="width: 100%;">
                </div>

                <div id="freelancerFields" class="form-group">
                    <label for="primarySkill">Primary Skill</label>
                    <select id="primarySkill" style="width: 100%;">
                        <option value="Web Development">Web Development</option>
                        <option value="UI/UX Design">UI/UX Design</option>
                        <option value="Graphic Design">Graphic Design</option>
                        <option value="Writing">Writing & Copywriting</option>
                        <option value="Marketing">Digital Marketing</option>
                        <option value="Video Editing">Video Editing</option>
                    </select>
                </div>

                <div id="clientFields" class="hidden form-group">
                    <label for="companyName">Company / Organization</label>
                    <input type="text" id="companyName" placeholder="e.g. Apex Tech Ventures" style="width: 100%;">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-weight: 700; margin-top: 0.5rem;">Create Account</button>
                <div class="form-alert" id="regAlert" style="display: none;"></div>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
